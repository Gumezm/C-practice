name: Sync to CNB
on:
  push:
    branches: [main]   # 仅主分支推送时同步；若默认分支是 master，请改为 [master]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 必须拉取完整历史，否则推送可能不完整

      - name: Sync to CNB Repository
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: "https://cnb.cool/Gumezm/C-practice.git"
          PLUGIN_AUTH_TYPE: "https"
          PLUGIN_USERNAME: "cnb"
          PLUGIN_PASSWORD: ${{ secrets.CNB_TOKEN }} # 与第二步设置的 Secret 名称一致
          PLUGIN_FORCE: "true"